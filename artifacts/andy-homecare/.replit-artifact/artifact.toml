kind = "web"
previewPath = "/"
title = "Andy Homecare Connect"
version = "1.0.0"
id = "artifacts/andy-homecare"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21050

[services.development]
run = "pnpm --filter @workspace/andy-homecare run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/andy-homecare", "run", "build" ]
serve = "static"
publicDir = "artifacts/andy-homecare/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21050"
BASE_PATH = "/"
